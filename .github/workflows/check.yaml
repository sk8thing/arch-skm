name: Check (fmt, vet, test, race)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmtcheck

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Race detector
        env:
          CGO_ENABLED: "1"
        run: make race
