name: Release (build and deploy)

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yaml

  build:
    name: Build linux/amd64
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          echo "Building ${GITHUB_REF_NAME} for linux/amd64"
          make build completions VERSION="$GITHUB_REF_NAME"

      - name: Package
        run: |
          file bin/skm bin/skmctl
          name="${GITHUB_REPOSITORY#*/}_linux_amd64"
          archive="${name}.tar.gz"

          tar -czf "$archive" --transform "s,^bin,${name}," bin
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-linux-amd64
          path: |
            *.tar.gz
            *.tar.gz.sha256

  deploy:
    name: Deploy
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: dist/

      - name: List Assets
        run: ls -lh dist

      - name: Generate Release Notes
        uses: orhun/git-cliff-action@v4
        with:
          version: "v2.14.2"
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Append Full Changelog Link
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            notes="$(cat RELEASE_NOTES.md)"
            printf '%s\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$notes" "$GITHUB_REPOSITORY" "$previous" "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
